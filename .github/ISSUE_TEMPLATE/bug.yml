name: Bug
description: Something broke on an already running stack
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste passwords, `.env`, `config.php`, or dumps.
        For DWG, go through [docs/cad.md](https://github.com/iSmartyPRO/docker-nextcloud/blob/main/docs/cad.md) first.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Nextcloud / login
        - LDAP
        - SMB
        - Collabora
        - CAD / DWG
        - PostgreSQL
        - Nginx
        - Image build
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nextcloud version
      placeholder: "34.x, occ status output"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: Commands and clicks, no secrets
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Already checked
      placeholder: "occ status, compose ps, matrix item from docs/deploy.md"
