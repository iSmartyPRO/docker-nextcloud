name: Deploy
description: A new host, upgrade, or move does not match the runbook
title: "[deploy] "
labels: ["deploy"]
body:
  - type: markdown
    attributes:
      value: |
        Follow [docs/deploy.md](https://github.com/iSmartyPRO/docker-nextcloud/blob/main/docs/deploy.md) step by step.
        If a step does not match the fact on the server — stop and describe that step. Do not “fix around it”.
  - type: dropdown
    id: scenario
    attributes:
      label: Scenario
      options:
        - A — new host
        - B — upgrade
        - C — move
        - D — MariaDB → PostgreSQL
        - Not sure
    validations:
      required: true
  - type: input
    id: step
    attributes:
      label: Runbook step where you stopped
      placeholder: "B5, A4, section 7 item 14"
    validations:
      required: true
  - type: textarea
    id: fact
    attributes:
      label: Fact on the server
      placeholder: Command output without passwords
    validations:
      required: true
  - type: checkboxes
    id: invariants
    attributes:
      label: Invariants
      options:
        - label: Image is built from the Dockerfile, not a stock nextcloud:latest
        - label: .env and backups will not be committed
        - label: set-cad.sh already ran if this is about DWG
